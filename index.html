<script>
const L=[
["الدَّرْسُ الأَوَّلُ: أَسْبَابُ الْفَلَاحِ","Lesson 1: Causes of Success",
"اعْلَمْ رَحِمَكَ اللهُ أَنَّهُ يَجِبُ عَلَيْنَا تَعَلُّمُ أَرْبَعِ مَسَائِلَ: الأُولَى: الْعِلْمُ، وَهُوَ مَعْرِفَةُ اللهِ، وَمَعْرِفَةُ نَبِيِّهِ، وَمَعْرِفَةُ دِينِ الإِسْلَامِ بِالأَدِلَّةِ. الثَّانِيَةُ: الْعَمَلُ بِهِ. الثَّالِثَةُ: الدَّعْوَةُ إِلَيْهِ. الرَّابِعَةُ: الصَّبْرُ عَلَى الأَذَى فِيهِ. وَالدَّلِيلُ قَوْلُهُ تَعَالَى: ﴿وَالْعَصْرِ ۝ إِنَّ الإِنسَانَ لَفِي خُسْرٍ ۝ إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ﴾",
"Know, may Allah have mercy on you, that we must learn four matters: (1) Knowledge: knowing Allah, His Prophet and the religion of Islam with evidences. (2) Acting upon it. (3) Calling others to it. (4) Patience with the harm faced in doing so. Proof: “By time, mankind is in loss, except those who believe, do righteous deeds, and advise each other to truth and to patience.” (Surah Al-‘Asr)",
[["Q1. Which matters must you learn?","Knowledge, action, calling to it, and patience."],["Q2. By what did Allah swear?","By time (al-‘Asr), to show that every person is in loss except those with the four qualities."],["Q3. What are the causes of success in the Surah?","Faith, righteous deeds, advising one another to truth, and advising one another to patience."],["Q4. Why is patience mentioned after advising truth?","Because whoever calls to the truth will face harm, so patience is needed."],["Q5. What did Imam ash-Shāfi‘ī say?","Had Allah revealed no other proof to His creation than this Surah, it would suffice them."]]],
["الدَّرْسُ الثَّانِي: الْعِلْمُ يَسْبِقُ الْعَمَلَ","Lesson 2: Knowledge Comes Before Action",
"قَالَ الْبُخَارِيُّ رَحِمَهُ اللهُ تَعَالَى: بَابٌ: الْعِلْمُ قَبْلَ الْقَوْلِ وَالْعَمَلِ. وَالدَّلِيلُ قَوْلُهُ تَعَالَى: ﴿فَاعْلَمْ أَنَّهُ لَا إِلَٰهَ إِلَّا اللَّهُ وَاسْتَغْفِرْ لِذَنبِكَ﴾ فَبَدَأَ بِالْعِلْمِ قَبْلَ الْقَوْلِ وَالْعَمَلِ.",
"Al-Bukhārī said: Chapter: Knowledge before speech and action. Proof: “So know that there is no god but Allah, and seek forgiveness for your sin” (Muhammad 47:19). Allah began with knowledge before speech and action.",
[["Q1. What is true knowledge?","What the Messenger ﷺ brought in the Qur’an and Sunnah."],["Q2. Why do people fall into innovations and errors?","Ignorance of the true religion and not seeking Islamic knowledge."],["Q3. What did Allah command in the verse?","To know that there is no god but Allah, and to seek forgiveness."],["Q4. Why does knowledge precede action?","Worship is only correct and accepted if built on sound knowledge of the Sharī‘ah."]]],
["الدَّرْسُ الثَّالِثُ: وُجُوبُ طَاعَةِ الرَّسُولِ ﷺ وَالْبُعْدِ عَنِ الشِّرْكِ","Lesson 3: Obeying the Messenger ﷺ and Avoiding Shirk",
"الأُولَى: أَنَّ اللهَ خَلَقَنَا وَرَزَقَنَا وَلَمْ يَتْرُكْنَا هَمَلًا، بَلْ أَرْسَلَ إِلَيْنَا رَسُولًا، فَمَنْ أَطَاعَهُ دَخَلَ الْجَنَّةَ، وَمَنْ عَصَاهُ دَخَلَ النَّارَ. الثَّانِيَةُ: أَنَّ اللهَ لَا يَرْضَى أَنْ يُشْرَكَ مَعَهُ أَحَدٌ فِي عِبَادَتِهِ، لَا مَلَكٌ مُقَرَّبٌ وَلَا نَبِيٌّ مُرْسَلٌ. ﴿وَأَنَّ الْمَسَاجِدَ لِلَّهِ فَلَا تَدْعُوا مَعَ اللَّهِ أَحَدًا﴾",
"First: Allah created and provided for us and did not leave us aimless; He sent us a Messenger. Whoever obeys him enters Paradise; whoever disobeys enters the Fire (Pharaoh disobeyed and was seized severely, Al-Muzzammil 15–16). Second: Allah is not pleased that anyone be associated with Him in worship, not an angel near to Him nor a sent prophet. “The mosques are for Allah, so do not call upon anyone along with Allah.” (Al-Jinn 18)",
[["Q1. Why were messengers sent?","So we are not left aimless; they show the truth, the path to Paradise and warn from the Fire."],["Q2. Ruling on calling upon others besides Allah (even prophets and righteous)?","Forbidden: “Do not call upon anyone along with Allah.”"],["Q3. Reward of obeying Allah and the Messenger?","Paradise."],["Q4. Punishment for disobeying them?","The Fire."],["Q5. Fate of Pharaoh?","Seized with a severe, destructive punishment: drowned in the sea, then the Fire."]]],
["الدَّرْسُ الرَّابِعُ: لَا يَجُوزُ مُوَالَاةُ مَنْ حَادَّ اللهَ وَرَسُولَهُ","Lesson 4: No Loyalty to Those Who Oppose Allah and His Messenger",
"الثَّالِثَةُ: أَنَّ مَنْ أَطَاعَ الرَّسُولَ وَوَحَّدَ اللهَ لَا يَجُوزُ لَهُ مُوَالَاةُ مَنْ حَادَّ اللهَ وَرَسُولَهُ وَلَوْ كَانَ أَقْرَبَ قَرِيبٍ. ﴿لَا تَجِدُ قَوْمًا يُؤْمِنُونَ بِاللَّهِ وَالْيَوْمِ الآخِرِ يُوَادُّونَ مَنْ حَادَّ اللَّهَ وَرَسُولَهُ﴾ (المجادلة ٢٢)",
"Third: whoever obeys the Messenger and singles out Allah may not have loyalty (muwālāh) to those who oppose Allah and His Messenger, even the closest relative. “You will not find a people who believe in Allah and the Last Day loving those who oppose Allah and His Messenger.” (Al-Mujādalah 22)",
[["Q1. May we love Jews and Christians (with proof)?","No, loving those who oppose Allah and His Messenger is not allowed (Al-Mujādalah 22). Kind, just dealings are different from religious loyalty."],["Q2. Reward of one who hates Allah’s enemies for His sake?","Faith is written in their hearts, Allah supports them, admits them to Gardens, is pleased with them, and they are the successful party."],["Q3. Meaning of muwālāh?","Love and support for Allah, His Messenger and the believers in words and deeds."]]],
["الدَّرْسُ الْخَامِسُ: الْحَنِيفِيَّةُ","Lesson 5: Al-Ḥanīfiyyah",
"اعْلَمْ أَرْشَدَكَ اللهُ لِطَاعَتِهِ أَنَّ الْحَنِيفِيَّةَ مِلَّةُ إِبْرَاهِيمَ: أَنْ تَعْبُدَ اللهَ وَحْدَهُ مُخْلِصًا لَهُ الدِّينَ. وَبِذَلِكَ أَمَرَ اللهُ جَمِيعَ النَّاسِ. ﴿وَمَا خَلَقْتُ الْجِنَّ وَالإِنسَ إِلَّا لِيَعْبُدُونِ﴾ أَيْ لِيُوَحِّدُونِ. وَأَعْظَمُ مَا أَمَرَ اللهُ بِهِ التَّوْحِيدُ، وَأَعْظَمُ مَا نَهَى عَنْهُ الشِّرْكُ. ﴿وَاعْبُدُوا اللَّهَ وَلَا تُشْرِكُوا بِهِ شَيْئًا﴾",
"Al-Ḥanīfiyyah is the creed of Ibrāhīm: worship Allah alone, sincere to Him in religion. Allah commanded all people with this. “I created jinn and mankind only to worship Me” (51:56), meaning to single Me out. The greatest command is Tawḥīd; the greatest prohibition is Shirk (calling on others with Allah). “Worship Allah and associate nothing with Him.” (An-Nisā’ 36)",
[["Q1. Greatest thing Allah forbade / commanded?","Forbade: Shirk (ب). Commanded: Tawḥīd (ج)."],["Q2. What did Allah command His Prophet ﷺ to say if Jews and Christians call him to their religions?","“Rather, the creed of Ibrāhīm, a ḥanīf, who was not of the polytheists.” (Al-Baqarah 135)"],["Q3. What is the creed of Ibrāhīm?","Worshipping Allah alone, sincere to Him in religion."]]],
["الدَّرْسُ السَّادِسُ: الأُصُولُ الثَّلَاثَةُ","Lesson 6: The Three Fundamentals",
"فَإِذَا قِيلَ لَكَ: مَا الأُصُولُ الثَّلَاثَةُ الَّتِي يَجِبُ عَلَى الإِنْسَانِ مَعْرِفَتُهَا؟ فَقُلْ: مَعْرِفَةُ الْعَبْدِ رَبَّهُ، وَدِينَهُ، وَنَبِيَّهُ مُحَمَّدًا ﷺ. الأَصْلُ الأَوَّلُ: مَعْرِفَةُ الْعَبْدِ رَبَّهُ. فَإِذَا قِيلَ: مَنْ رَبُّكَ؟ فَقُلْ: رَبِّيَ اللهُ الَّذِي رَبَّانِي وَرَبَّى جَمِيعَ الْعَالَمِينَ بِنِعْمَتِهِ، وَهُوَ مَعْبُودِي لَيْسَ لِي مَعْبُودٌ سِوَاهُ. وَالدَّلِيلُ: ﴿الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ﴾",
"If asked: what are the three fundamentals a person must know? Say: a servant’s knowledge of his Lord, his religion, and his Prophet Muhammad ﷺ. First: knowing one’s Lord. If asked “Who is your Lord?” say: My Lord is Allah, who nurtured me and all the worlds with His favors; He is my object of worship, I have none besides Him. Proof: “All praise is for Allah, Lord of the worlds.” (Al-Fātiḥah 2)",
[["Q1. The three fundamentals?","Knowing your Lord, your religion, and your Prophet Muhammad ﷺ (the questions of the grave)."],["Q2. Meaning of ar-Rabb?","The Creator, Owner and Sustainer who nurtures all creation with His favors."],["Q3. Proof of Allah’s lordship over all worlds?","“All praise is for Allah, Lord of the worlds.”"]]],
["الدَّرْسُ السَّابِعُ: آيَاتُ اللهِ وَمَخْلُوقَاتُهُ","Lesson 7: Allah’s Signs and Creations",
"فَإِذَا قِيلَ لَكَ: بِمَ عَرَفْتَ رَبَّكَ؟ فَقُلْ: بِآيَاتِهِ وَمَخْلُوقَاتِهِ. وَمِنْ آيَاتِهِ اللَّيْلُ وَالنَّهَارُ وَالشَّمْسُ وَالْقَمَرُ. وَمِنْ مَخْلُوقَاتِهِ السَّمَاوَاتُ السَّبْعُ وَالأَرَضُونَ السَّبْعُ وَمَا فِيهِنَّ وَمَا بَيْنَهُمَا. ﴿وَمِنْ آيَاتِهِ اللَّيْلُ وَالنَّهَارُ وَالشَّمْسُ وَالْقَمَرُ لَا تَسْجُدُوا لِلشَّمْسِ وَلَا لِلْقَمَرِ وَاسْجُدُوا لِلَّهِ الَّذِي خَلَقَهُنَّ إِنْ كُنتُمْ إِيَّاهُ تَعْبُدُونَ﴾",
"If asked “How did you know your Lord?” say: through His signs and creations. His signs: night, day, sun and moon. His creations: the seven heavens, the seven earths, and all in and between them. “Among His signs are night, day, sun and moon. Do not prostrate to the sun or moon, but prostrate to Allah who created them, if it is Him you worship.” (Fuṣṣilat 37)",
[["Q1. How do we know our Lord?","Through His signs and creations."],["Q2. Some of His signs and creations?","Night, day, sun, moon; the heavens and the earths."],["Q3. What proves Allah’s power?","The creation of the heavens and earth in six days, and subjecting the sun, moon and stars by His command (Al-A‘rāf 54)."],["Q4–5. What does the greatness of creation show?","The greatness and power of the Creator, so we humble ourselves to Him."]]],
["الدَّرْسُ الثَّامِنُ: الْخَالِقُ الْمُنْعِمُ هُوَ الَّذِي يَسْتَحِقُّ الْعِبَادَةَ","Lesson 8: The Creator, the Bestower, Alone Deserves Worship",
"وَالرَّبُّ هُوَ الْمَعْبُودُ. ﴿يَا أَيُّهَا النَّاسُ اعْبُدُوا رَبَّكُمُ الَّذِي خَلَقَكُمْ وَالَّذِينَ مِنْ قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ ۝ الَّذِي جَعَلَ لَكُمُ الأَرْضَ فِرَاشًا وَالسَّمَاءَ بِنَاءً وَأَنزَلَ مِنَ السَّمَاءِ مَاءً فَأَخْرَجَ بِهِ مِنَ الثَّمَرَاتِ رِزْقًا لَّكُمْ فَلَا تَجْعَلُوا لِلَّهِ أَندَادًا وَأَنتُمْ تَعْلَمُونَ﴾ قَالَ ابْنُ كَثِيرٍ رَحِمَهُ اللهُ: الْخَالِقُ لِهَذِهِ الأَشْيَاءِ هُوَ الْمُسْتَحِقُّ لِلْعِبَادَةِ.",
"The Lord is the one worshipped. “O people, worship your Lord who created you and those before you, so you may be mindful of Him; who made the earth a bed and the sky a canopy, and sent down water from the sky and brought forth fruits as provision. So do not set up rivals to Allah while you know.” (Al-Baqarah 21–22) Ibn Kathīr: the Creator of these things is the One who deserves worship.",
[["Q1. What does the verse command and forbid?","Commands worship of Allah alone; forbids setting up rivals to Him."],["Q2. Complete: Ibn Kathīr said…","…the Creator of these things is the One who deserves worship."],["Q3. Some blessings in the verse and what they show?","Earth as a bed, sky as a canopy, rain, fruits; they show the Creator alone deserves worship."],["Q4. Who deserves worship?","Allah alone; every other object of worship is false."]]],
["الدَّرْسُ التَّاسِعُ: أَنْوَاعُ الْعِبَادَةِ وَحُكْمُ مَنْ صَرَفَ شَيْئًا مِنْهَا لِغَيْرِ اللهِ","Lesson 9: Types of Worship and the Ruling on Directing Them to Other Than Allah",
"وَأَنْوَاعُ الْعِبَادَةِ الَّتِي أَمَرَ اللهُ بِهَا: الإِسْلَامُ وَالإِيمَانُ وَالإِحْسَانُ، وَمِنْهُ: الدُّعَاءُ وَالْخَوْفُ وَالرَّجَاءُ وَالتَّوَكُّلُ وَالرَّغْبَةُ وَالرَّهْبَةُ وَالْخُشُوعُ وَالْخَشْيَةُ وَالإِنَابَةُ وَالاسْتِعَانَةُ وَالاسْتِعَاذَةُ وَالاسْتِغَاثَةُ وَالذَّبْحُ وَالنَّذْرُ. فَمَنْ صَرَفَ مِنْهَا شَيْئًا لِغَيْرِ اللهِ فَهُوَ مُشْرِكٌ كَافِرٌ. ﴿وَمَنْ يَدْعُ مَعَ اللَّهِ إِلَٰهًا آخَرَ لَا بُرْهَانَ لَهُ بِهِ فَإِنَّمَا حِسَابُهُ عِندَ رَبِّهِ إِنَّهُ لَا يُفْلِحُ الْكَافِرُونَ﴾ وَفِي الْحَدِيثِ: «الدُّعَاءُ هُوَ الْعِبَادَةُ».",
"Types of worship Allah commanded: Islam, Īmān, Iḥsān, and among them: supplication, fear, hope, reliance, desire, awe, humility, reverent fear, turning back, seeking help, seeking refuge, seeking rescue, sacrifice and vows. Whoever directs any of it to other than Allah is a polytheist and disbeliever. “Whoever calls on another god with Allah, with no proof, his reckoning is with his Lord; the disbelievers will not succeed.” (Al-Mu’minūn 117). Hadith: “Supplication is worship.” Verse: “Your Lord says: Call upon Me and I will answer you; those too proud to worship Me will enter Hell humbled.” (Ghāfir 60)",
[["Q1. Ruling on directing some worship to other than Allah?","Shirk and disbelief."],["Q2. Fate of one too proud to worship Allah?","Entering Hell humbled (Ghāfir 60)."],["Q3. Proof that supplication is worship?","The hadith “Supplication is worship” and Ghāfir 60."],["Q4. Someone at a grave says “O owner of the grave, enrich me / relieve my distress.” Ruling and advice?","It is shirk, because supplication belongs to Allah alone. Advise him kindly with proof to call upon Allah directly."],["Q5. Some types of worship?","Fear, hope, reliance, vows, sacrifice, supplication, etc."],["Q6. Conditions for acceptance of a good deed?","Sincerity (for Allah’s face alone) and following the Sunnah (not innovations)."]]],
["الدَّرْسُ الْعَاشِرُ: أَدِلَّةُ بَعْضِ أَنْوَاعِ الْعِبَادَةِ (١)","Lesson 10: Evidences for Some Types of Worship (1)",
"دَلِيلُ الْخَوْفِ: ﴿فَلَا تَخَافُوهُمْ وَخَافُونِ إِن كُنتُم مُّؤْمِنِينَ﴾. دَلِيلُ الرَّجَاءِ: ﴿فَمَن كَانَ يَرْجُو لِقَاءَ رَبِّهِ فَلْيَعْمَلْ عَمَلًا صَالِحًا وَلَا يُشْرِكْ بِعِبَادَةِ رَبِّهِ أَحَدًا﴾. دَلِيلُ التَّوَكُّلِ: ﴿وَعَلَى اللَّهِ فَتَوَكَّلُوا إِن كُنتُم مُّؤْمِنِينَ﴾. دَلِيلُ الرَّغْبَةِ وَالرَّهْبَةِ وَالْخُشُوعِ: ﴿إِنَّهُمْ كَانُوا يُسَارِعُونَ فِي الْخَيْرَاتِ وَيَدْعُونَنَا رَغَبًا وَرَهَبًا وَكَانُوا لَنَا خَاشِعِينَ﴾. دَلِيلُ الْخَشْيَةِ: ﴿فَلَا تَخْشَوْهُمْ وَاخْشَوْنِي﴾. دَلِيلُ الإِنَابَةِ: ﴿وَأَنِيبُوا إِلَىٰ رَبِّكُمْ وَأَسْلِمُوا لَهُ﴾.",
"Fear: “Do not fear them; fear Me, if you are believers” (Āl ‘Imrān 175). Hope: “Whoever hopes to meet his Lord, let him do righteous deeds and not associate anyone in worship of his Lord” (Al-Kahf 110). Reliance: “Put your trust in Allah, if you are believers” (Al-Mā’idah 23); “Whoever relies on Allah, He is sufficient for him” (Aṭ-Ṭalāq 3). Desire, awe, humility: “They used to hasten to good deeds, call upon Us in hope and fear, and were humble before Us” (Al-Anbiyā’ 90). Reverent fear: “Do not fear them, fear Me” (Al-Baqarah 150). Turning back: “Turn to your Lord and submit to Him” (Az-Zumar 54).",
[["Fill in: types of worship","Fear, hope, reliance, desire, awe, humility, reverent fear, turning back…"],["Match","Fear and awe = restraining oneself from what Allah forbade, out of fear of His warning. Reliance = the heart relying on Allah. Turning back (Ināba) = returning to Allah in repentance."],["Quranic proofs","Hope: Al-Kahf 110. Reliance: Al-Mā’idah 23. Reverent fear: Al-Baqarah 150. Turning back: Az-Zumar 54. Desire: Al-Anbiyā’ 90."]]],
["الدَّرْسُ الْحَادِي عَشَرَ: أَدِلَّةُ بَعْضِ أَنْوَاعِ الْعِبَادَةِ (٢)","Lesson 11: Evidences for Some Types of Worship (2)",
"دَلِيلُ الاسْتِعَانَةِ: ﴿إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ﴾، وَفِي الْحَدِيثِ: «إِذَا اسْتَعَنْتَ فَاسْتَعِنْ بِاللهِ». دَلِيلُ الاسْتِعَاذَةِ: ﴿قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ﴾ وَ﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ﴾. دَلِيلُ الاسْتِغَاثَةِ: ﴿إِذْ تَسْتَغِيثُونَ رَبَّكُمْ فَاسْتَجَابَ لَكُمْ﴾. دَلِيلُ الذَّبْحِ: ﴿قُلْ إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ ۝ لَا شَرِيكَ لَهُ﴾، وَمِنَ السُّنَّةِ: «لَعَنَ اللهُ مَنْ ذَبَحَ لِغَيْرِ اللهِ». دَلِيلُ النَّذْرِ: ﴿يُوفُونَ بِالنَّذْرِ وَيَخَافُونَ يَوْمًا كَانَ شَرُّهُ مُسْتَطِيرًا﴾.",
"Seeking help: “You alone we worship, You alone we ask for help”; hadith: “When you seek help, seek help from Allah.” Seeking refuge: “Say: I seek refuge in the Lord of daybreak / of mankind.” Seeking rescue: “When you sought your Lord’s rescue, He answered you” (Al-Anfāl 9). Sacrifice: “Say: My prayer, my sacrifice, my life and my death are for Allah, Lord of the worlds; He has no partner” (Al-An‘ām 162–163); hadith: “Allah cursed whoever sacrifices for other than Allah.” Vow: “They fulfil vows and fear a Day whose evil is widespread” (Al-Insān 7).",
[["Q1. What did Allah command in “Say: I seek refuge in the Lord of daybreak”?","To seek refuge in Allah alone."],["Q2. What did the Prophet ﷺ command in “When you seek help…”?","To seek help from Allah."],["Q3. Meanings","Istiʿānah: asking Allah’s help with full humility and entrusting the matter to Him. Istighāthah: asking Allah for rescue, to bring good and remove harm. Istiʿādhah: taking refuge in and holding fast to Allah in full need of Him."],["Note","Asking a living, present person for what he is able to do (e.g. lifting luggage, rescuing you from drowning) is permissible and not shirk. A vow (nadhr) is worship and must not be made to a grave or anyone other than Allah."]]],
["الدَّرْسُ الثَّانِي عَشَرَ: دِينُ الإِسْلَامِ","Lesson 12: The Religion of Islam",
"الأَصْلُ الثَّانِي: مَعْرِفَةُ دِينِ الإِسْلَامِ بِالأَدِلَّةِ. وَهُوَ الاسْتِسْلَامُ لِلَّهِ بِالتَّوْحِيدِ، وَالانْقِيَادُ لَهُ بِالطَّاعَةِ، وَالْبَرَاءَةُ مِنَ الشِّرْكِ وَأَهْلِهِ. وَهُوَ ثَلَاثُ مَرَاتِبَ: الإِسْلَامُ وَالإِيمَانُ وَالإِحْسَانُ، وَكُلُّ مَرْتَبَةٍ لَهَا أَرْكَانٌ. ﴿وَمَن يَبْتَغِ غَيْرَ الإِسْلَامِ دِينًا فَلَن يُقْبَلَ مِنْهُ وَهُوَ فِي الآخِرَةِ مِنَ الْخَاسِرِينَ﴾",
"Second fundamental: knowing the religion of Islam with evidences. It is submission to Allah through Tawḥīd, yielding to Him in obedience, and disassociating from shirk and its people. It has three levels: Islam, Īmān, Iḥsān, each with pillars. “Whoever seeks a religion other than Islam, it will never be accepted from him, and in the Hereafter he will be among the losers.” (Āl ‘Imrān 85)",
[["Q1. The true religion and the proof?","Islam; Āl ‘Imrān 85."],["Q2. Levels of the religion?","Islam, Īmān, Iḥsān."],["Q3. Fill in","Islam is submission to Allah through Tawḥīd, yielding to Him in obedience, and disassociating from shirk and its people."],["Q4. Yes or No","Islam is the path to Paradise: Yes. Other religions are ruinous to their followers: Yes. We know Islam from the Qur’an and Sunnah: Yes."]]]
